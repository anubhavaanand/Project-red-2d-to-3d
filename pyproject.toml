[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "image-to-3d-benchmark"
version = "0.1.0"
description = "Benchmarking feed-forward single-image 3D reconstruction across paradigms"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anubhav Anand", email = "anubhavanand354@gmail.com" }]
keywords = [
    "3d-reconstruction",
    "image-to-3d",
    "benchmark",
    "gaussian-splatting",
    "nerf",
    "diffusion",
]
dependencies = [
    "numpy>=1.26.0,<3.0",
    # PKG-14: the floor keeps ancient, known-vulnerable Pillow out. The
    # CVE-2026-112404 / -112899 / -128066 fixes all land in 13.0.0, which
    # requires Python >=3.11; on 3.10 pip resolves 12.3.0, the newest wheel that
    # still supports it, and those advisories stay unfixable upstream.
    "pillow>=12.3,<14.0",
    "scipy>=1.11,<2.0",
    "pydantic>=2.6,<3.0",
    # PKG-05: imported by src/engines/_compat.py (spar3d_compat_shims) and by the
    # SPAR3D engine path. Declared as a hard dependency so a minimal install does
    # not fail at import time.
    "packaging>=23.2,<26.0",
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# Extra groups (PKG-12).
#
# `pip install -e .` alone is the *core* slice: numpy/scipy/pillow/pydantic plus
# the lightweight 3D + tabular helpers the evaluation harness and result CSV
# tooling need. It deliberately does NOT pull torch, gradio, or the CUDA stack,
# and it is enough to run scripts/validate_results.py and the unit tests.
#
#   .[engines]   CPU inference stack (torch + engine-side third-party deps)
#   .[app]       Gradio demo (engines + gradio)
#   .[api]       FastAPI server (engines + fastapi/uvicorn)
#   .[notebooks] Kaggle/Colab kernel glue (engines + pandas/matplotlib)
#   .[sf3d]      SF3D prerequisites (engines + xatlas/jaxtyping/trimesh)
#   .[dev]       lint/test/security tooling
#   .[all]       every group above
#
# GPU/CUDA-only pieces (LGM's diff-gaussian-rasterization, TRELLIS's spconv /
# flash-attn / xformers, SF3D's custom_rasterizer) are NOT pip deps: they must
# be built per docs/COMPILE.md, and the extras here only name their pure-python
# prerequisites.
#
# Upper bounds (PKG-14) are the tested ranges from requirements.txt; a
# requirements.lock with hashes is generated by `make lock` (PKG-15).
# ---------------------------------------------------------------------------
core = [
    "trimesh>=4.0,<5.0",
    "pandas>=2.0,<3.0",
    "scikit-image>=0.22,<0.26",
    "networkx>=3.0,<4.0",
]
engines = [
    "image-to-3d-benchmark[core]",
    "torch>=2.1,<3.0",
    "torchvision>=0.16,<1.0",
    "huggingface-hub>=0.20,<1.0",
    "diffusers>=0.26,<1.0",
    "transformers>=4.38,<5.0",
    "accelerate>=0.27,<2.0",
    "safetensors>=0.4,<1.0",
    "einops>=0.7,<1.0",
    "omegaconf>=2.3,<3.0",
    "tyro>=0.5,<1.0",
    "roma>=1.4,<2.0",
    "plyfile>=1.0,<2.0",
    "scikit-learn>=1.4,<2.0",
    "imageio[ffmpeg]>=2.34,<3.0",
    "timm>=0.9,<2.0",
    "kornia>=0.7,<1.0",
    "easydict>=1.13,<2.0",
    "jaxtyping>=0.2.34,<1.0",
    "ftfy>=6.1,<7.0",
    "regex>=2023.12,<3000.0",
    "loralib>=0.1.2,<1.0",
    "lpips>=0.1.4,<0.2",
    "pyrender>=0.1.45,<0.2",
    "xatlas>=0.0.9,<0.1",
    # PKG-07: the [cpu] extra is what pulls onnxruntime. Listing bare `rembg`
    # installs no ONNX runtime at all, so `import rembg` then fails at
    # BackgroundRemover construction. Keep it on the CPU provider and do not
    # also list `onnxruntime` explicitly, or pip may install both runtimes.
    "rembg[cpu]>=2.0.50,<3.0",
]
app = [
    "image-to-3d-benchmark[engines]",
    "gradio>=4.19,<6.0",
]
api = [
    "image-to-3d-benchmark[engines]",
    "fastapi>=0.109,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    # Required by fastapi.Form/File uploads; without it /predict raises at runtime.
    "python-multipart>=0.0.9,<1.0",
]
notebooks = [
    "image-to-3d-benchmark[engines]",
    "matplotlib>=3.7,<4.0",
    "pandas>=2.0,<3.0",
]
# PKG-11: SF3D is implemented (src/engines/sf3d_engine.py) but its CUDA
# extensions (custom_rasterizer, texture) cannot be pip-installed. The extra
# names only the pure-python prerequisites; the build steps live in
# docs/COMPILE.md, so `pip install -e ".[sf3d]"` is a documentation pointer.
sf3d = [
    "image-to-3d-benchmark[engines]",
    "xatlas>=0.0.9,<0.1",
    "jaxtyping>=0.2.34,<1.0",
    "trimesh>=4.0,<5.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.1,<7.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.9,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "build>=1.0,<2.0",
    "twine>=5.0,<7.0",
]
all = [
    "image-to-3d-benchmark[core,engines,app,api,notebooks,sf3d,dev]",
]

[tool.setuptools]
packages = ["src", "src.api", "src.data", "src.engines", "src.evaluation", "src.export", "src.preprocessing"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without strict= parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__
"tests/*" = ["B011"]      # assert false in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "gpu: marks tests as requiring GPU/CUDA (deselect with '-m \"not gpu\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]