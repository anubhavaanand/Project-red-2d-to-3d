name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  test:
    # Q1: pyproject.toml declares requires-python >=3.10, so the matrix has to
    # actually exercise 3.10 / 3.11 / 3.12 rather than only the version we
    # happen to develop on.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          pip install -e .
          pip install pytest numpy pillow scipy trimesh pandas scikit-image networkx

      - name: Run pytest
        run: pytest tests/ -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit

      - name: Bandit (security lint)
        run: |
          # B108 hardcoded_tmp_directory: the engine wrappers deliberately probe
          #   well-known clone locations (/tmp/<Repo>, /kaggle/working). These are
          #   directories we read from, not temp files we create; the actual output
          #   directory is configurable (API-05) and created 0o700 (SEC-27).
          # B310 urllib url open: model_weights.py fetches only the pinned HTTPS
          #   URLs in _PINS and verifies the SHA-256 of what it downloads (SEC-12).
          bandit -r src/ -ll -ii -s B108,B310

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and audit tools
        run: |
          pip install -e .
          pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: |
          # setuptools is a build backend, not a shipped dependency. The reported
          # advisories (PYSEC-2026-3447, GHSA-xmj3-9gf7-h52w) affect sdist
          # building and Windows wheel installation, neither of which we do.
          pip-audit --desc --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xmj3-9gf7-h52w

  import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install numpy pillow scipy trimesh pandas pydantic

      - name: Verify the modules that need no GPU import cleanly
        run: |
          python -c "
          from src.engines.base import Mesh3D, GaussianCloud, ReconstructionResult
          from src.engines._mask import derive_foreground_mask
          from src.engines._memory import free_cuda_cache
          from src.engines._outputs import extract_mesh_object
          from src.engines._paths import extend_sys_path
          from src.model_weights import asset
          from src.evaluation.chamfer_distance import compute_chamfer_distance
          from src.evaluation.f_score import compute_f_score
          from src.config import AppConfig, EngineType
          print('Core modules import OK')
          "

  results-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pandas

      - name: Validate results CSV contract
        run: python scripts/validate_results.py
